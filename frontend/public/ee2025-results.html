<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Rennergebnisse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #f9f9f9;
      font-family: Arial, sans-serif;
      color: #222;
    }
    header, footer {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 16px;
    }
    .viewer-wrap {
      height: calc(100vh - 140px);
      max-width: 1200px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .viewer {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 8px 14px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      text-decoration: none;
      color: #222;
    }
    .btn:hover { background: #f0f0f0; }
    .note { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>Rennergebnisse – Wednesdayriders Enter Ensmann 2025</h1>
    <div class="actions">
      <a class="btn" href="results.pdf" download>PDF herunterladen</a>
      <a class="btn" href="results.pdf" target="_blank">In neuem Tab öffnen</a>
      <span class="note">Falls die Anzeige nicht lädt, nutzen Sie „In neuem Tab öffnen“.</span>
    </div>
  </header>

  <main class="viewer-wrap" aria-label="PDF Viewer">
    <iframe class="viewer" src="ee2025-results.pdf"></iframe>
  </main>

  <footer>
    <p class="note">Kontakt: mail@wednesdayriders.com</p>
  </footer>
</body>
</html>
